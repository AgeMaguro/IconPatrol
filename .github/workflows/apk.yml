# Builds the Icon Patrol Android app and the Windows PC app, and publishes both as the newest GitHub release.
# Stable download links: https://github.com/AgeMaguro/IconPatrol/releases/latest/download/IconPatrol.apk
#                        https://github.com/AgeMaguro/IconPatrol/releases/latest/download/IconPatrol-PC.exe
# The app's in-game updater reads this repo's latest release (name "Icon Patrol 1.0.N", N = versionCode).
name: Icon Patrol APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'past-versions/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # +10 so versions continue above the builds made in Claude-HQ (1.0.1 - 1.0.3)
      VC_OFFSET: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (pinned to exact commit)
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1 (pinned)
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3 (pinned)
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: |
          set -o pipefail
          VC=$(( ${{ github.run_number }} + VC_OFFSET ))
          echo "VC=$VC" >> "$GITHUB_ENV"
          gradle --no-daemon assembleRelease -Pvc=$VC 2>&1 | tee build-output.txt
          cp app/build/outputs/apk/release/app-release.apk IconPatrol.apk
      - name: Build PC app (Windows portable exe, Electron)
        # a PC build problem never blocks the Android release; the exe is just left out
        continue-on-error: true
        run: |
          set -o pipefail
          cd pc
          mkdir -p game && cp ../IconPatrol.html game/index.html
          npm install --no-audit --no-fund
          npm pkg set version=1.0.$VC
          npx electron-builder --win portable --x64 --publish never 2>&1 | tee -a ../build-output.txt
          cp dist/IconPatrol-PC.exe ../IconPatrol-PC.exe
          git checkout -- package.json   # version bump is build-only; keep the tree clean for the archive commit
      - name: Publish release (old APK moves to past-versions/)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh release view latest --json name -q .name 2>/dev/null | sed 's/^Icon Patrol //' || true)
          if [ -n "$prev" ]; then
            mkdir -p past-versions
            gh release download latest -p IconPatrol.apk -O "past-versions/IconPatrol-$prev.apk" --clobber
          fi
          gh release delete build-failed --cleanup-tag -y || true
          gh release delete latest --cleanup-tag -y || true
          files="IconPatrol.apk"; [ -f IconPatrol-PC.exe ] && files="$files IconPatrol-PC.exe"
          gh release create latest $files --latest \
            --title "Icon Patrol 1.0.$VC" \
            --notes "Icon Patrol 1.0.$VC, built from ${{ github.sha }}. Android: download IconPatrol.apk and open it, or use the in-game ⬆ update button. Windows PC: download IconPatrol-PC.exe and run it (no install; Windows may warn because it isn't signed: More info → Run anyway). Changes: CHANGELOG.md"
          if [ -n "$prev" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add past-versions
            if ! git diff --cached --quiet; then
              git commit -m "Archive version $prev in past-versions"
              git pull --rebase --autostash origin main && git push origin HEAD:main
            fi
          fi
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -c 60000 build-output.txt > build-output-tail.txt 2>/dev/null || echo "no build output" > build-output-tail.txt
          gh release delete build-failed --cleanup-tag -y || true
          gh release create build-failed build-output-tail.txt --prerelease \
            --title "Icon Patrol build FAILED (run ${{ github.run_number }})" --notes "See the attached build output."
